name: Jurisdiction Certification

on:
  pull_request:
    branches: [mvp-integration-w100, main]
    paths:
      - 'lib/platform/**'
      - 'lib/roadready/**'
      - 'app/api/scout/**'
      - 'components/Scout**'
      - 'e2e/roadready.spec.ts'
      - 'scripts/jurisdiction-certify.mjs'
      - 'lib/platform/state-package-factory.ts'
      - 'lib/platform/state-package-factory.test.ts'
      - 'lib/platform/legal-source-queue.ts'
      - 'lib/platform/legal-source-queue.test.ts'
      - 'app/api/admin/legal-sources/route.ts'
      - 'app/admin/legal-sources/page.tsx'
      - 'package.json'
      - '.github/workflows/jurisdiction-certify.yml'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run jurisdiction:certify
