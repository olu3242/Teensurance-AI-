name: Branch Build Certification
on:
  pull_request:
    branches:
      - mvp-integration-w100
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run brand:certify
      - run: npm run build
